# Render.com Blueprint — https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hoophub-image-processor
    runtime: docker
    rootDir: services/image-processor
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVICE_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
